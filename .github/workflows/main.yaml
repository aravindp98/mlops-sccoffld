name: MLOps CI/CD to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: devmlops-496015
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPOSITORY: mlops-house-prices
  IMAGE_NAME: mlops-app
  CLOUD_RUN_SERVICE: mlops-house-prices-service
  GCP_SERVICE_ACCOUNT: github-actions-cicd@devmlops-496015.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/913344865801/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  MLFLOW_ARTIFACT_URI: gs://devmlops-496015-mlops-artifacts/mlflow
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  DVC_REMOTE: gs://devmlops-496015-mlops-artifacts/dvc

jobs:
  # -------------------------------------------------------
  # Job 1: Test — lint + unit tests
  # -------------------------------------------------------
  test:
    name: Test Python app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Lint
        run: pylint --disable=R,C main.py

      - name: Run tests
        run: pytest -vv test_main.py

  # -------------------------------------------------------
  # Job 2: Train — DVC pipeline run + MLflow log
  # -------------------------------------------------------
  train:
    name: DVC Pipeline + MLflow Training
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # WIF auth — DVC GCS pull/push + MLflow GCS artifacts
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: pip install -r requirement.txt

      # DVC pull — GCS-la irundhu data + models download
      - name: Pull data from DVC remote
        run: dvc pull

      # DVC repro — pipeline run (prepare → train → evaluate)
      # train stage-la MLflow automatically log aagum
      - name: Run DVC pipeline
        run: dvc repro

      # Updated model.joblib + metrics GCS-ku push
      - name: Push updated artifacts to DVC remote
        run: dvc push

      # metrics/scores.json — GitHub Actions summary-la show pannudu
      - name: Show metrics
        run: dvc metrics show

  # -------------------------------------------------------
  # Job 3: Build & Push Docker image
  # -------------------------------------------------------
  build_push:
    name: Build and push to Artifact Registry
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # DVC pull — model.joblib Docker image-la include pannuvom
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install DVC
        run: pip install dvc dvc-gs

      - name: Pull model from DVC remote
        run: dvc pull models/model.joblib

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:latest" \
            -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:latest"
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

  # -------------------------------------------------------
  # Job 4: Deploy to Cloud Run
  # -------------------------------------------------------
  deploy_cloud_run:
    name: Deploy to Cloud Run
    needs: build_push
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy image to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --quiet
